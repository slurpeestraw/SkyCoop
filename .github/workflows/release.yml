name: Build and Release

on:
  push:
    branches:
      - Reborn
      - "feature/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "6.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  UPSTREAM_REPOSITORY: Filigrani/SkyCoop
  UPSTREAM_RELEASE_TAG: RebornV1
  MELONLOADER_VERSION: "0.7.3"

jobs:
  prepare-data:
    name: Fetch upstream bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download "$UPSTREAM_RELEASE_TAG" \
            --repo "$UPSTREAM_REPOSITORY" \
            --pattern 'SkyCoop*.zip' \
            --output upstream.zip

          mkdir -p upstream
          unzip -q upstream.zip 'Mods/SkyModData/*' -d upstream
          test -d upstream/Mods/SkyModData

          tar -czf skycoop-data.tar.gz -C upstream/Mods SkyModData

      - name: Upload server data
        uses: actions/upload-artifact@v4
        with:
          name: skycoop-data
          path: skycoop-data.tar.gz
          if-no-files-found: error

      - name: Upload upstream bundle
        uses: actions/upload-artifact@v4
        with:
          name: skycoop-upstream
          path: upstream.zip
          if-no-files-found: error

  client:
    name: Build client bundle
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download upstream bundle
        uses: actions/download-artifact@v4
        with:
          name: skycoop-upstream
          path: .

      - name: Download MelonLoader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download "v${MELONLOADER_VERSION}" \
            --repo LavaGang/MelonLoader \
            --pattern 'MelonLoader.x64.zip' \
            --output melonloader.zip

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare client bundle
        run: |
          set -euo pipefail

          rm -rf client-bundle melonloader
          mkdir -p client-bundle melonloader

          unzip -q upstream.zip -d client-bundle
          unzip -q melonloader.zip -d melonloader

          rm -rf client-bundle/MelonLoader
          cp -a melonloader/MelonLoader client-bundle/MelonLoader
          cp melonloader/version.dll client-bundle/version.dll

          mkdir -p dependencies
          cp client-bundle/Mods/ModSettings.dll dependencies/ModSettings.dll

      - name: Build client
        run: dotnet build SkyCoopClient/SkyCoopClient.csproj -c Release

      - name: Replace client binaries
        run: |
          set -euo pipefail

          cp Output/Release/SkyCoopClient.dll client-bundle/Mods/SkyCoopClient.dll
          cp Output/Release/SkyCoopServer.dll client-bundle/Mods/SkyCoopServer.dll

      - name: Archive client bundle
        run: |
          cd client-bundle
          zip -qr ../SkyCoopClient-win-x64.zip .

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: SkyCoopClient-win-x64
          path: SkyCoopClient-win-x64.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare-data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - linux-arm
          - win-x64
          - win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download server data
        uses: actions/download-artifact@v4
        with:
          name: skycoop-data
          path: .

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish
        run: >
          dotnet publish SkyCoopServerHost/SkyCoopServerHost.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}

      - name: Bundle server data
        run: |
          mkdir -p upstream-data
          tar -xzf skycoop-data.tar.gz -C upstream-data
          cp -a upstream-data/SkyModData "publish/${{ matrix.rid }}/"

      - name: Archive
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          zip -qr "../../SkyCoopServer-${{ matrix.rid }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyCoopServer-${{ matrix.rid }}
          path: SkyCoopServer-${{ matrix.rid }}.zip
          if-no-files-found: error

  test:
    name: Run server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test
        run: dotnet test SkyCoopServer.Tests -c Release --logger "console;verbosity=normal"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - client
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SkyCoop*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "SkyCoop Reborn $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
